# Copies README.md to the profile repos on GitLab (llawn06/llawn06) and Codeberg (llawn/.profile)
name: Sync profile
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["README.md"]
jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - forge: GitLab
            remote: gitlab.com/llawn06/llawn06.git
            user: oauth2
            secret: GITLAB_TOKEN
          - forge: Codeberg
            remote: codeberg.org/llawn/.profile.git
            user: llawn
            secret: CODEBERG_PUSH_TOKEN
    steps:
      - uses: actions/checkout@v4
      - name: Push README to ${{ matrix.forge }}
        env:
          TOKEN: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::${{ matrix.secret }} is not set, skipping ${{ matrix.forge }}"
            exit 0
          fi
          url="https://${{ matrix.user }}:${TOKEN}@${{ matrix.remote }}"
          git clone --depth 1 "$url" target
          cp README.md target/README.md
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Sync README from github.com/llawn/llawn@${GITHUB_SHA::7}"
          # An empty repo has no branch yet, so name it explicitly
          git push origin HEAD:main
