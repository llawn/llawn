# Builds forges.svg, a combined summary of my GitHub, Codeberg and GitLab accounts
name: Forges
on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["*.svg"]
jobs:
  forges-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Also used by sync-profile.yml to push; here only for the GitLab follower count
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          # Optional, read:user scope; Codeberg only lists starred repos to a logged-in client
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: python .github/scripts/forges.py forges.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forges.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update forges.svg - [Skip GitHub Action]"
          git pull --rebase
          git push
